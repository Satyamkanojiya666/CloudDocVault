{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:460px;margin:30px auto"><h2>&#128274; Protected file</h2>
<p><strong>{{ doc.original_name }}</strong> ({{ doc.size_bytes|human }}) is password protected.</p>
{% if wrong %}<div class="flash error">Wrong password. Try again.</div>{% endif %}
<form method="post" action="{{ url_for('shared_download', token=token) }}">
<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<input type="password" name="password" placeholder="Enter password" required autofocus>
<button class="btn">Unlock &amp; download</button></form></div>
{% endblock %}
